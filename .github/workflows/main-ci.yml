# This workflow will protect the main branch by testing and linting new PRs and commits

name: Main CI
permissions:
  contents: read

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    environment: hana-integration
    strategy:
      matrix:
        node-version: [22, 24]

    name: test - node.js ${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci --package-lock
      - name: deploy hana schema
        id: deploySchema
        run: npm run test:deploySchema
        env:
          HANA_DB_CREDENTIALS: ${{secrets.HANA_DB_CREDENTIALS}}
      - run: npm run test:prepare
      - run: npm run test:unit
      - run: npm run voter:test:integration
        env:
          GITHUB_ACTION_HANA: true
          SCHEMA_GUIDS: ${{steps.deploySchema.outputs.schemaGuids}}
          HANA_DB_CREDENTIALS: ${{secrets.HANA_DB_CREDENTIALS}}
      - run: npm run test:cleanSchemas
        if: always()
        env:
          HANA_DB_CREDENTIALS: ${{secrets.HANA_DB_CREDENTIALS}}
          SCHEMA_GUIDS: ${{steps.deploySchema.outputs.schemaGuids}}

  test-postgres:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]

    name: postgres test - node.js ${{ matrix.node-version }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eventqueue
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CDS_ENV: postgres
      CDS_REQUIRES_DB_CREDENTIALS_HOST: localhost
      CDS_REQUIRES_DB_CREDENTIALS_PORT: 5432
      CDS_REQUIRES_DB_CREDENTIALS_USER: postgres
      CDS_REQUIRES_DB_CREDENTIALS_PASSWORD: postgres
      CDS_REQUIRES_DB_CREDENTIALS_DATABASE: eventqueue
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci --package-lock
      - name: deploy postgres schemas
        id: deploySchema
        run: npm run test:deploySchema:postgres
      - run: npm run test:prepare
      - run: npm run voter:test:integration
        env:
          POSTGRES_SCHEMAS: ${{ steps.deploySchema.outputs.schemas }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci --package-lock
      - run: npm run lint:ci

  example-cap-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm i --prefix example-cap-server
      - run: npm run test --prefix example-cap-server
